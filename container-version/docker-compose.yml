services:
  frontend:
    image: roboticpuppies/conduit-frontend:${FRONTEND_VERSION}
    depends_on:
      - backend
  backend:
    image: roboticpuppies/conduit-backend:${BACKEND_VERSION}
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:insecurepassword@db:5432/demo
      - JWT_SECRET=6b350c623d150e8a07d36e963e1416079a7a322e8c04952d674fe607914d7b01
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: insecurepassword
      POSTGRES_DB: demo
    volumes:
      - db_data:/var/lib/postgresql/data
  proxy:
    image: nginx:stable-alpine
    ports:
      - "8090:80"
    volumes:
      - ./proxy/vhost.conf:/etc/nginx/conf.d/default.conf
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  db_data: